<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)" rx="110"/>
  <rect x="6" y="6" width="500" height="500" fill="none" stroke="#1e293b" stroke-width="12" rx="104"/>

  <!-- Inner Grid lines -->
  <g stroke="#1e293b" stroke-width="6" opacity="0.6">
    <line x1="0" y1="170" x2="512" y2="170" stroke-dasharray="12 12"/>
    <line x1="0" y1="341" x2="512" y2="341" stroke-dasharray="12 12"/>
    <line x1="170" y1="0" x2="170" y2="512" stroke-dasharray="12 12"/>
    <line x1="341" y1="0" x2="341" y2="512" stroke-dasharray="12 12"/>
  </g>

  <!-- Node connections (circuit-like) -->
  <path d="M 128 256 L 64 256 M 384 256 L 448 256 M 256 128 L 256 64 M 256 384 L 256 448" stroke="#334155" stroke-width="20" stroke-linecap="round"/>

  <!-- Main AMR Body (Hexagon) -->
  <path d="M 256 130 L 364 193 L 364 319 L 256 382 L 148 319 L 148 193 Z" fill="#1e293b" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round" />
  
  <!-- Outer glowing core -->
  <circle cx="256" cy="256" r="64" fill="url(#accent)" filter="url(#glow)" opacity="0.2"/>

  <!-- Scanner line -->
  <rect x="180" y="240" width="152" height="32" rx="16" fill="#bfdbfe" opacity="0.95" filter="url(#glow)"/>
</svg>
